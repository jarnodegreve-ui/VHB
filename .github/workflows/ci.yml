# CI-vangnet (2026-07-30): elke PR draait typecheck, unit-tests, build en de
# e2e-smoke — dezelfde vier stappen die lokaal al golden, maar nu afdwingbaar.
# Aanleiding: #252 crashte het admin-dashboard in productie terwijl alle
# checks lokaal groen waren — ze waren alleen nooit op die wijziging gedraaid.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Op een PR annuleert een nieuwe push de vorige run (die uitslag wil niemand
# meer). Op main niet: bij een reeks merges vlak na elkaar annuleerden de runs
# elkaar, en stond er voor drie van de vier commits nooit een uitslag
# (21-09). Elke commit op main krijgt nu zijn eigen groen of rood.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimale token-rechten (controle 05-09, nr. 30): geen enkele job schrijft
# naar de repo. Cache, artifacts en de job-samenvatting lopen via het
# runtime-token en hebben hier niets aan nodig. Een job die meer nodig heeft,
# vraagt het zelf (zie gitleaks).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies
        run: npm ci

      # Alleen productie-dependencies en alleen high/critical: een laag
      # advisory in een dev-tool mag geen enkel ander werk blokkeren.
      - name: Dependency-audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run lint

      # Strict in fases (golf 4, punt 20): `strict: true` voor shared/** en
      # src/lib/** via tsconfig.strict.json. Blokkerend, want die kring is
      # groen; de rest van src/ (bij de meting 121 fouten, 94 in App.tsx)
      # volgt in latere fases door `include` daar uit te breiden.
      - name: Typecheck (strict, shared + lib)
        run: npm run lint:strict

      # Design-systeem-bewaking (fase A, 03-09-2026): geen dark:-utilities,
      # rauwe knoppen, off-ladder maten/radii — zie scripts/design-lint.mjs.
      - name: Design-lint
        run: npm run lint:design

      - name: Unit-tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundelgrootte
        run: node scripts/check-bundle-size.mjs

  # E2E in drie parallelle shards (21-09). In één job duurde deze stap 469 s
  # van de ±630 s, en Lighthouse wachtte daar nog eens 6,5 min achter: 17 min
  # per run. Nu lopen statische checks, drie e2e-shards en Lighthouse naast
  # elkaar en bepaalt de traagste de doorlooptijd (±7 min). Playwright
  # verdeelt de tests zelf over de shards, over alle projecten heen
  # (`fullyParallel` staat aan in playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Playwright-browsers-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps ook bij een cache-hit: de systeembibliotheken (vooral
      # voor WebKit) zitten niet in de cache.
      - name: Playwright-browsers
        run: npx playwright install --with-deps chromium webkit

      # De e2e-webServer bouwt zelf mét VITE_SUPABASE-dummy-env (zie
      # playwright.config.ts). Mobiel en desktop in Chromium, plus mobiele
      # navigatieregressies in WebKit. a11y.spec.ts (axe, WCAG 2.1 AA) draait
      # op beide Chromium-viewports.
      - name: E2E-smoke (shard ${{ matrix.shard }} van 3)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      # PWA-e2e (golf 4, punt 20): het project `pwa` draait mét service
      # worker: registratie + GET_VERSION, koude offline start van Mijn dag
      # uit de SW-cache met het offline-label, en de update-flow (nieuwe
      # worker → "Vernieuw"-toast → SKIP_WAITING → herlaad). Niet-blokkerend
      # zolang niet bewezen is dat SW-gedrag in headless Chromium op een
      # gedeelde runner stabiel is: rood hier is een signaal voor de reviewer.
      # TODO: continue-on-error weghalen zodra hij een paar weken groen is.
      # E2E_SKIP_BUILD hergebruikt de dist die de smoke hierboven net met
      # dezelfde dummy-env bouwde (geen tweede build).
      # Alleen in de eerste shard: het is één klein project.
      - name: E2E PWA (service worker, niet-blokkerend)
        if: matrix.shard == 1
        continue-on-error: true
        env:
          E2E_SKIP_BUILD: "1"
        run: npm run test:e2e:pwa

  # Prestatiebudget (09-2026): Lighthouse CI op de gebouwde app, mobiel
  # geëmuleerd (Moto-G-klasse, gesimuleerde 4G — de bus, niet de kantoor-Mac),
  # 3 runs per URL en de mediaan telt. Loginscherm én Mijn dag (ingelogd als
  # chauffeur via de e2e-fixtures, zie scripts/lighthouse-server.mjs).
  #
  # Drempels (.lighthouserc.json, per URL via assertMatrix):
  #   - scores  → error: performance ≥ 0,90 (login), accessibility ≥ 0,95,
  #               best-practices ≥ 0,90. Scores zijn stabiel genoeg op een
  #               gedeelde runner om hard te blokkeren. /mijn-dag staat op
  #               performance ≥ 0,80: de stand op 06-09 was 0,85–0,88 (mediaan
  #               0,87) door de seriële auth-keten devices/register → me →
  #               data (drie 4G-roundtrips vóór de eerste inhoud); 0,80 is
  #               dus regressiebewaking, geen doel — trek hem naar 0,90 zodra
  #               die keten korter is.
  #   - metrics → warn: LCP ≤ 2500 ms, CLS ≤ 0,1, TBT ≤ 300 ms. Absolute
  #               milliseconden jitteren op ubuntu-latest (gedeelde CPU) —
  #               een waarschuwing in de log is het signaal, niet een rode PR.
  #               Zet ze op error zodra een paar weken logs laten zien dat ze
  #               nooit flappen.
  #
  # @lhci/cli via npx (vastgepind, --yes), niet als devDependency: het pakket
  # trekt Lighthouse + Chrome-launcher mee (±40 MB) en zou anders élke job
  # (checks, visueel) langer laten installeren voor iets dat alleen hier
  # draait. Rapporten (HTML + JSON) komen als artifact mee; bewust géén
  # temporary-public-storage — dat is tokenloos, maar zet het rapport op een
  # publieke URL van Google, en dat heeft niemand nodig.
  # Geen `needs: checks` meer (21-09): Lighthouse bouwt zelf en hangt van
  # niets uit die job af; het wachten kostte alleen 10 minuten doorlooptijd.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Zelfde dummy-env als e2e/visueel, op de Lighthouse-poort (4191):
      # zonder VITE_SUPABASE_* rendert de app "configuratie ontbreekt".
      VITE_SUPABASE_URL: http://localhost:4191
      VITE_SUPABASE_ANON_KEY: e2e-dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # autorun = healthcheck + collect (start scripts/lighthouse-server.mjs
      # zelf) + assert + upload naar .lighthouseci/rapporten (filesystem).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Lighthouse-rapporten als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore
          # upload-artifact v4.4+ slaat verborgen mappen (.lighthouseci) over
          # tenzij dit aanstaat; zonder was er bij een gefaalde assert nooit
          # een rapport om in te kijken (07-09).
          include-hidden-files: true

  # Secret-scanner (verbeterronde 01-09, nr. 5): de repo is publiek en er is
  # al eens een bot-token gelekt (via een transcript, niet de repo — maar het
  # vangnet ontbrak). gitleaks scant de gepushte commits op secrets en laat
  # de check falen vóór iets publiek staat.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # De action leest de PR-commits via de API (pull-requests: read). PR-
    # commentaar bij een vondst zou pull-requests: write vragen — bewust uit:
    # de rode check is het signaal, en een schrijvend token op een publieke
    # repo is meer rechten dan dit nodig heeft.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Visuele regressie (verbeterronde 03-09, nr. 11): de sleutelschermen
  # (lijst SCHERMEN in scripts/visueel-ci.mjs; sinds 20-09 achttien, met
  # Mijn dag, designsysteem, werkvoorraad en de techniek-/loonschermen) op
  # deze branch én op de basis-branch schieten (gemockte API) en per pixel
  # vergelijken — scripts/visueel-ci.mjs. Geen baselines in de repo: de
  # basis-branch is de referentie. Boven 1,5 % per scherm faalt de
  # job NIET: de tabel in de job-samenvatting en de diff-afbeeldingen in het
  # artifact zijn een signaal voor de reviewer, geen blokkade.
  visueel:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Zelfde dummy-env als de e2e-build: anders rendert de app de
      # "configuratie ontbreekt"-melding i.p.v. de schermen.
      VITE_SUPABASE_URL: http://localhost:4173
      VITE_SUPABASE_ANON_KEY: e2e-dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: node_modules-cache
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Playwright-browsers-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps ook bij een cache-hit: de systeembibliotheken (vooral
      # voor WebKit) zitten niet in de cache.
      - name: Playwright-browsers (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      - name: Build (deze branch)
        run: npm run build

      - name: Basis-branch uitchecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .visueel-basis

      - name: Basis-branch bouwen
        working-directory: .visueel-basis
        run: |
          npm ci
          npm run build

      - name: Screenshots (deze branch + basis)
        run: |
          node scripts/visueel-ci.mjs schiet --app . --out .visueel/kop
          node scripts/visueel-ci.mjs schiet --app .visueel-basis --out .visueel/basis

      - name: Vergelijken (drempel 1,5 % per scherm)
        run: node scripts/visueel-ci.mjs vergelijk .visueel/basis .visueel/kop --out .visueel/verschil --drempel 1.5

      - name: Diff-afbeeldingen als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visuele-regressie
          path: .visueel
          retention-days: 14
          if-no-files-found: ignore
