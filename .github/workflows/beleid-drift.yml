# Beleidsdrift-check (verbeterronde 07-09, nr. 10): elke nacht de live
# beveiligingsstand van Supabase (RLS, policies, grants, definer-functies)
# vergelijken met het gecommitte snapshot supabase/beleid-snapshot.json.
# Migraties draaien met de hand in de SQL Editor; dit is het bewijs dat wat
# live staat nog is wat de repo zegt. Verschil = rode run = mail via de
# gewone GitHub-notificaties.
#
# Aparte workflow (niet in ci.yml): de PR-jobs hoeven niet op een schema te
# draaien en deze job heeft geen npm ci nodig (script zonder dependencies).
#
# Secrets (repo-instellingen, zie README › Beleidssnapshot):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY            → productie (verplicht)
#   STAGING_SUPABASE_URL, STAGING_SERVICE_ROLE_KEY     → staging: wakker houden
#                                                        (laatste stap) en, als
#                                                        supabase/beleid-snapshot-staging.json
#                                                        gecommit is, ook de
#                                                        driftvergelijking
# Ontbreken de productie-secrets, dan slaat de job netjes over (geen fout):
# de check is dan gewoon nog niet ingericht.
name: Beleidsdrift

on:
  schedule:
    # 04:00 UTC = 06:00 Belgische zomertijd / 05:00 wintertijd.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: beleid-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beleid-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Secrets aanwezig?
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Secrets SUPABASE_URL en/of SUPABASE_SERVICE_ROLE_KEY ontbreken: beleidsdrift-check overgeslagen (inrichten: README › Beleidssnapshot)."
            echo "productie=false" >> "$GITHUB_OUTPUT"
          else
            echo "productie=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SERVICE_ROLE_KEY" ]; then
            echo "staging=false" >> "$GITHUB_OUTPUT"
          else
            echo "staging=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Productie vergelijken
        if: steps.secrets.outputs.productie == 'true'
        run: node scripts/beleid-drift.mjs

      # Ook na een rode productie-stap: beide uitkomsten in één run.
      - name: Staging vergelijken
        if: ${{ !cancelled() && steps.secrets.outputs.staging == 'true' }}
        run: node scripts/beleid-drift.mjs --omgeving staging

      # Staging wakker houden (03-10, herzien 30-10): de gratis laag van
      # Supabase pauzeert een project na een week zonder "user database
      # activity" (een paar echte queries per dag), en staging krijgt die
      # alleen als een PR-preview of iemand ermee praat. Tot 30-10 deed deze
      # stap een Auth-gezondheidscheck en een REST-verzoek met de publieke
      # sleutel: geen van beide bereikt de database (health raakt geen tabel;
      # anon heeft sinds 2026-09-29 geen rechten en wordt vóór elke query
      # geweigerd), en de pauzewaarschuwing kwam toch (mail 28-09, opnieuw
      # gemeld op 30-10).
      # Daarom nu drie kleine select-queries met de service-sleutel van
      # staging, de enige rol die nog mag lezen. Nooit rood: een mislukte
      # wekker is een warning, geen alarm.
      - name: Staging wakker houden
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SERVICE_ROLE_KEY" ]; then
            echo "::notice::STAGING_SUPABASE_URL en/of STAGING_SERVICE_ROLE_KEY ontbreken: staging niet wakker gehouden."
            exit 0
          fi
          # Een nieuwe sleutel (sb_secret_…) gaat alleen in de apikey-header;
          # de oude JWT-sleutel ook als Bearer (zoals scripts/beleid-drift.mjs).
          auth=()
          case "$STAGING_SERVICE_ROLE_KEY" in
            sb_*) ;;
            *) auth=(-H "Authorization: Bearer $STAGING_SERVICE_ROLE_KEY") ;;
          esac
          geslaagd=0
          uitkomst=""
          for pad in 'users?select=id&limit=1' 'schema_migraties?select=bestand&limit=1' 'dagtype_codes?select=code&limit=1'; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "apikey: $STAGING_SERVICE_ROLE_KEY" "${auth[@]}" \
              "$STAGING_SUPABASE_URL/rest/v1/$pad" || echo 000)
            if [ "$code" = "200" ]; then
              geslaagd=$((geslaagd + 1))
            fi
            uitkomst="$uitkomst ${pad%%\?*}=$code"
          done
          echo "staging wakker houden:$uitkomst ($geslaagd/3 geslaagd)"
          if [ "$geslaagd" -eq 0 ]; then
            echo "::warning::Geen enkele staging-query slaagde ($uitkomst): gepauzeerd, verkeerde sleutel of onbereikbaar? Kijk in het Supabase-dashboard."
          fi
