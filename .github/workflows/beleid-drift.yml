# Beleidsdrift-check (verbeterronde 07-09, nr. 10): elke nacht de live
# beveiligingsstand van Supabase (RLS, policies, grants, definer-functies)
# vergelijken met het gecommitte snapshot supabase/beleid-snapshot.json.
# Migraties draaien met de hand in de SQL Editor; dit is het bewijs dat wat
# live staat nog is wat de repo zegt. Verschil = rode run = mail via de
# gewone GitHub-notificaties.
#
# Aparte workflow (niet in ci.yml): de PR-jobs hoeven niet op een schema te
# draaien en deze job heeft geen npm ci nodig (script zonder dependencies).
#
# Secrets (repo-instellingen, zie README › Beleidssnapshot):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY            → productie (verplicht)
#   STAGING_SUPABASE_URL, STAGING_SERVICE_ROLE_KEY     → staging (optioneel,
#                                                        alleen als ook
#                                                        supabase/beleid-snapshot-staging.json
#                                                        gecommit is)
#   STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY    → staging wakker houden
#                                                        (zie de laatste stap)
# Ontbreken de productie-secrets, dan slaat de job netjes over (geen fout):
# de check is dan gewoon nog niet ingericht.
name: Beleidsdrift

on:
  schedule:
    # 04:00 UTC = 06:00 Belgische zomertijd / 05:00 wintertijd.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: beleid-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beleid-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Secrets aanwezig?
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Secrets SUPABASE_URL en/of SUPABASE_SERVICE_ROLE_KEY ontbreken: beleidsdrift-check overgeslagen (inrichten: README › Beleidssnapshot)."
            echo "productie=false" >> "$GITHUB_OUTPUT"
          else
            echo "productie=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SERVICE_ROLE_KEY" ]; then
            echo "staging=false" >> "$GITHUB_OUTPUT"
          else
            echo "staging=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Productie vergelijken
        if: steps.secrets.outputs.productie == 'true'
        run: node scripts/beleid-drift.mjs

      # Ook na een rode productie-stap: beide uitkomsten in één run.
      - name: Staging vergelijken
        if: ${{ !cancelled() && steps.secrets.outputs.staging == 'true' }}
        run: node scripts/beleid-drift.mjs --omgeving staging

      # Staging wakker houden (03-10): de gratis laag van Supabase pauzeert een
      # project na zeven dagen zonder API-verzoeken, en staging krijgt die
      # alleen als een PR-preview of iemand ermee praat (mail van 28-09:
      # "vhb-portaal-staging is going to be paused"). Elke nacht één verzoek
      # naar de Auth-API (200 met de publieke sleutel) en één naar de REST-API
      # (401: anon heeft daar sinds 2026-09-29 bewust geen rechten, maar het
      # verzoek telt). Alleen de publieke publishable-sleutel is nodig; de
      # drift-stap hierboven doet hetzelfde met de service-sleutel zodra die
      # er is, en dan is deze stap dubbel maar onschadelijk. Nooit rood: een
      # mislukte wekker is een notice, geen alarm.
      - name: Staging wakker houden
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SUPABASE_ANON_KEY" ]; then
            echo "::notice::STAGING_SUPABASE_URL en/of STAGING_SUPABASE_ANON_KEY ontbreken: staging niet wakker gehouden."
            exit 0
          fi
          auth=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "apikey: $STAGING_SUPABASE_ANON_KEY" "$STAGING_SUPABASE_URL/auth/v1/health" || echo 000)
          rest=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "apikey: $STAGING_SUPABASE_ANON_KEY" -H "Authorization: Bearer $STAGING_SUPABASE_ANON_KEY" "$STAGING_SUPABASE_URL/rest/v1/" || echo 000)
          echo "staging: auth/v1/health $auth, rest/v1 $rest"
          if [ "$auth" != "200" ]; then
            echo "::warning::Staging antwoordde $auth op auth/v1/health: gepauzeerd of onbereikbaar? Kijk in het Supabase-dashboard."
          fi
