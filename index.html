<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VHB Portaal</title>
    <meta name="description" content="Intern operationeel portaal voor Van Hoorebeke en Zoon — planning, omleidingen, verlof en updates." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D0D0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="VHB" />
    <!-- VHB-icoon (officiële huisstijl): zwarte tegel met amber monogram.
         SVG voor crisp rendering, .ico + PNG-fallbacks voor oudere browsers/iOS. -->
    <link rel="icon" type="image/svg+xml" href="/vhb-favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/vhb-favicon-64.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/vhb-icoon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/vhb-icoon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />

    <!-- Service worker registratie: cache app shell voor offline gebruik. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .catch((err) => console.warn('SW registratie mislukt:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
