<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VHB Portaal</title>
    <meta name="description" content="Intern operationeel portaal voor Van Hoorebeke en Zoon — planning, omleidingen, verlof en updates." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e8a33d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VHB" />
    <!-- VHB favicon: zwart afgerond vierkant met oker bus erin. SVG voor
         crisp rendering, PNG-fallbacks voor browsers/iOS die geen SVG-icon
         accepteren (iOS < 15). -->
    <link rel="icon" type="image/svg+xml" href="/vhb-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/vhb-favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vhb-favicon-180.png" />

    <!-- Service worker registratie: cache app shell voor offline gebruik. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .catch((err) => console.warn('SW registratie mislukt:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
