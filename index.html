<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VHB Portaal</title>
    <meta name="description" content="Intern operationeel portaal voor Van Hoorebeke en Zoon — planning, omleidingen, verlof en updates." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D0D0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="VHB" />
    <!-- VHB-icoon (officiële huisstijl): zwarte tegel met amber monogram.
         SVG voor crisp rendering, .ico + PNG-fallbacks voor oudere browsers/iOS. -->
    <!-- Eén tab-favicon-set (speciaal daarvoor gemaakt): svg + 64px-png +
         .ico-fallback. De app-icoon-set (vhb-icoon.*) is bewust niet óók als
         tab-icoon gedeclareerd — dat was dubbel (browsers kiezen er één); die
         bestanden blijven voor het PWA-manifest. -->
    <link rel="icon" type="image/svg+xml" href="/vhb-favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/vhb-favicon-64.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />

    <!-- Zelf-gehoste fonts vooraf laden (latin-subset, meest gebruikt) zodat
         de tekst snel in de juiste font staat. crossorigin is verplicht voor
         font-preloads, ook same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-latin.woff2" crossorigin />

    <!-- Service worker registratie: cache app shell voor offline gebruik.
         updateViaCache:'none' + een update-check bij elke terugkeer naar de
         app: een standalone PWA die uit de app-switcher wordt hervat doet
         géén navigatie-fetch en bleef daardoor op een oude bundel hangen tot
         de gebruiker forceer-afsloot. De nieuwe SW blijft WACHTEN (geen
         auto-skipWaiting meer): de app toont een "Vernieuw"-toast en pas
         na die klik activeert de SW en herlaadt de controllerchange-listener
         hieronder één keer — nooit meer midden in een formulier. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then((registration) => {
              const checkForUpdate = () => {
                if (document.visibilityState === 'visible') registration.update().catch(() => {});
              };
              document.addEventListener('visibilitychange', checkForUpdate);
              window.addEventListener('focus', checkForUpdate);
            })
            .catch((err) => console.warn('SW registratie mislukt:', err));

          // Nieuwe worker heeft de controle overgenomen → één herlaad zodat
          // de pagina bij de verse assets hoort. Alleen bij een échte
          // vervanging: bij de allereerste installatie is er nog geen
          // controller en zou dit een overbodige herlaad geven. De vlag
          // voorkomt een herlaad-lus bij meerdere events.
          var hadController = !!navigator.serviceWorker.controller;
          var reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController || reloading) return;
            reloading = true;
            window.location.reload();
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
