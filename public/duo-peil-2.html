<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="UTF-8" />
<!-- Tijdelijke peilpagina voor de iPhone Duo (14-11). Nergens gelinkt, geen
     deel van de app. Ze draagt dezelfde kop-instellingen als de app
     (viewport, app-modus, statusbalk) en een eigen manifest met dezelfde
     weergave (Peil 2: zonder vaste stand), zodat ze op het beginscherm in dezelfde schil draait.
     Elke zone heeft een eigen kleur: zo toont één schermafbeelding van welke
     bron iOS de kleur van zijn eigen zones neemt. Weg te halen zodra de
     meting binnen is. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Peil 2</title>
<link rel="manifest" href="/duo-peil-2.webmanifest" />
<meta name="theme-color" content="#dda354" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Peil 2" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
<style>
  html { background-color: #64aade; }
  html, body { margin: 0; }
  body { min-height: 100vh; background-color: #dd8093; color: #111; font: 600 13px/1.45 ui-monospace, Menlo, monospace; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 2; background-color: #57bb92; padding: 8px 14px; font: 700 14px/1.3 -apple-system, sans-serif; }
  #rand { position: fixed; inset: 0; border: 3px solid #b00020; box-sizing: border-box; pointer-events: none; z-index: 3; }
  #veilig { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); border: 2px dashed #0b3d91; box-sizing: border-box; pointer-events: none; z-index: 3; }
  #p { position: fixed; visibility: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .maat { position: fixed; left: 0; top: 0; width: 0; visibility: hidden; }
  #knoppen { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 0; }
  #knoppen button { font: 700 13px/1 -apple-system, sans-serif; padding: 11px 12px; border-radius: 10px; border: 2px solid #111; background: #f2f3f4; color: #111; }
  #knoppen button[aria-pressed="true"] { background: #111; color: #f2f3f4; }
  pre { margin: 0; padding: 10px 14px 24px; white-space: pre-wrap; font: inherit; }
</style>
</head>
<body>
<header>Peil 2 · deze groene kop is de bovenrand van de pagina</header>
<div id="rand"></div><div id="veilig"></div><div id="p"></div>
<div class="maat" id="m-vh" style="height:100vh"></div>
<div class="maat" id="m-svh" style="height:100svh"></div>
<div class="maat" id="m-lvh" style="height:100lvh"></div>
<div class="maat" id="m-dvh" style="height:100dvh"></div>
<div id="knoppen" role="group" aria-label="Statusbalk">
  <button type="button" data-stijl="black-translucent">Statusbalk: doorzichtig</button>
  <button type="button" data-stijl="black">Statusbalk: zwart</button>
  <button type="button" data-stijl="default">Statusbalk: standaard</button>
</div>
<pre id="uit">De meting laadt…</pre>
<script src="/duo-peil.js?v=1" defer></script>
</body>
</html>
